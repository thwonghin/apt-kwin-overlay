name: CI

# Plain `pull_request`, never `pull_request_target`: GitHub withholds repo
# secrets and gives only a read-only GITHUB_TOKEN to `pull_request` runs
# from forks, which is what makes running untrusted fork code (arbitrary
# Cargo.toml/npm scripts) below safe. Do not swap this for
# `pull_request_target` to work around first-run approval friction --
# that swap is what actually exposes secrets to fork PRs.
on:
  push:
  pull_request:

# A new push/PR update cancels whatever's still running for that same
# branch/PR, rather than piling up parallel runs of the same commit range.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Ubuntu's default runner can't build this: libgtk4-layer-shell-dev
    # isn't packaged on Ubuntu until 26.04. Arch's `extra` repo has both
    # gtk4-layer-shell and webkitgtk-6.0 as first-class packages.
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        # git must be installed before actions/checkout, since the
        # container starts from a bare Arch image with no git. Full -Syu,
        # not -Sy: installing nodejs/etc. without upgrading the rest of the
        # system risks a partial-upgrade ABI mismatch (e.g. node built
        # against a newer glibc than the container's own libc).
        run: |
          pacman -Syu --noconfirm git nodejs npm rust gtk4-layer-shell webkitgtk-6.0 pkgconf base-devel namcap

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Caches ~/.cargo + target/, keyed on Cargo.lock + rustc version --
      # cargo/npm dependency compilation is most of this job's runtime.
      - uses: Swatinem/rust-cache@v2

      - name: Cache npm dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('vendor/awakened-poe-trade/renderer/package-lock.json') }}

      - name: Build renderer (vendored, unmodified Vue UI)
        run: ./scripts/build-renderer.sh

      - name: Build backend
        run: cargo build --release --locked

      - name: Validate PKGBUILD
        # Full `makepkg` would re-fetch the source via its own git+ URL,
        # which is redundant with the checkout above -- just confirm the
        # PKGBUILD parses (a real syntax/authoring error would fail this)
        # and run namcap for lint warnings.
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE' && makepkg --printsrcinfo" > /dev/null
          namcap PKGBUILD || true

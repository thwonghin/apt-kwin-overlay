name: Bump submodule

# GitHub Actions has no way to subscribe to push events on a third-party
# repo (that would require SnosMe/awakened-poe-trade to configure a
# webhook pointing at us), so this polls on a schedule instead -- the same
# approach Renovate/Dependabot use for tracking upstreams they don't own.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# Prevents an overlapping manual trigger from racing the scheduled run (or
# a second manual trigger racing itself) on the same branch.
concurrency:
  group: bump-submodule-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    # Cheap: a single network call, no container/build deps needed, so this
    # can run daily for free regardless of whether anything changed.
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Compare upstream HEAD to pinned commit
        id: diff
        run: |
          upstream=$(git ls-remote https://github.com/SnosMe/awakened-poe-trade.git HEAD | cut -f1)
          pinned=$(git rev-parse HEAD:vendor/awakened-poe-trade)
          if [ "$upstream" != "$pinned" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  bump-and-build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        # Full -Syu, not -Sy: see ci.yml -- avoids a partial-upgrade ABI
        # mismatch between newly-installed packages and the container's libc.
        run: |
          pacman -Syu --noconfirm git nodejs npm rust gtk4-layer-shell webkitgtk-6.0 pkgconf base-devel

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      # Container jobs check out as a different UID than the one that owns
      # the workspace on the host, which git's dubious-ownership check
      # rejects by default.
      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Record currently-pinned commit
        id: pinned
        run: echo "sha=$(git rev-parse HEAD:vendor/awakened-poe-trade)" >> "$GITHUB_OUTPUT"

      - name: Bump submodule to upstream HEAD
        run: git submodule update --remote vendor/awakened-poe-trade

      - name: Detect vendor contract-surface changes
        id: contract
        run: |
          # src/*.rs reimplements a slice of upstream's Electron main
          # process (main/src/**) and the wire types it shares with the
          # renderer (ipc/**) without a compiler enforcing the two stay in
          # sync -- a green build here only proves both sides compile, not
          # that message shapes/config schemas/allowlists still match.
          # Excludes the two subtrees WIP.md documents as permanently out
          # of scope regardless of upstream changes (AppUpdater.ts:
          # stubbed, doesn't apply to a locally-built binary; vision/**:
          # Windows-only OCR).
          changed=$(git -C vendor/awakened-poe-trade diff --name-only \
            "${{ steps.pinned.outputs.sha }}" HEAD -- 'main/src' 'ipc' \
            ':!main/src/AppUpdater.ts' ':!main/src/vision')

          if [ -n "$changed" ]; then
            echo "title=⚠️ Bump awakened-poe-trade submodule (contract files changed — review needed)" >> "$GITHUB_OUTPUT"
          else
            echo "title=Bump awakened-poe-trade submodule" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "body<<BODY_EOF"
            echo "Automated submodule bump to upstream's current HEAD."
            echo "Renderer build and \`cargo build --release --locked\` both passed in this workflow run before this PR was opened."
            if [ -n "$changed" ]; then
              echo ""
              echo "### ⚠️ Vendor contract surface changed"
              echo "This bump touches upstream file(s) that \`src/*.rs\` reimplements the wire contract of (see README.md's module table). A green build only means both sides *compile* — it does not confirm WebSocket/IPC message shapes, the config JSON schema, or allowlists still match. Diff the file(s) below against the corresponding \`src/*.rs\` module before merging:"
              echo ""
              while IFS= read -r f; do
                echo "- \`$f\`"
              done <<< "$changed"
            fi
            echo "BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      # After the bump, so the npm cache key reflects the lockfile the
      # bumped submodule actually ships, not the one we just replaced.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Cache npm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('vendor/awakened-poe-trade/renderer/package-lock.json') }}

      # Validate the bumped commit actually builds before proposing it --
      # deliberately duplicated from ci.yml rather than factored into a
      # reusable workflow: workflow_call runs against a freshly-checked-out
      # ref, which doesn't fit validating an in-progress, not-yet-pushed
      # bump in this same job.
      - name: Build renderer
        run: ./scripts/build-renderer.sh

      - name: Build backend
        run: cargo build --release --locked

      - name: Open PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore: bump awakened-poe-trade submodule"
          branch: bump-awakened-poe-trade
          title: ${{ steps.contract.outputs.title }}
          body: ${{ steps.contract.outputs.body }}

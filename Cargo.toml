[package]
name = "apt-wayland-overlay"
version = "0.1.0"
edition = "2024"

[dependencies]
gtk4 = { version = "0.11", features = ["gnome_50"] }
gtk4-layer-shell = "0.8"
webkit6 = "0.6"
zbus = "5.18"
ashpd = { version = "0.13", default-features = false, features = ["gtk4", "async-io", "global_shortcuts", "remote_desktop", "screencast", "clipboard"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "io"] }
async-io = "2"
async-channel = "2"
reis = { version = "0.7", features = ["async-io"] }
tungstenite = "0.30"
ureq = "3.3"
md-5 = "0.11"
